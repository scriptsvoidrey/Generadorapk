# NEXA APK STUDIO — Pipeline de compilación de APK real.
# Se dispara vía workflow_dispatch desde el backend (github.ts).
# NO hay wrapper gradle (gradlew): se usa gradle directamente vía setup-gradle.
name: Build APK (NEXA APK Studio)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID del build en NEXA"
        required: true
        type: string
      callback_token:
        description: "Token de callback para reportar estado/subir APK"
        required: true
        type: string
      source_url:
        description: "URL pública del zip fuente (incluye ?token=...)"
        required: true
        type: string

# PUBLIC_BASE_URL debe definirse en Settings > Secrets and variables > Actions > Variables.
env:
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
  BUILD_ID: ${{ inputs.build_id }}
  CALLBACK_TOKEN: ${{ inputs.callback_token }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout del builder
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configurar Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3

      - name: Instalar platform android-34 y build-tools 34.0.0
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Descargar fuente del build
        run: |
          curl -fSL --retry 3 --retry-delay 2 -o source.zip "${{ inputs.source_url }}"
          ls -la source.zip

      - name: Reportar estado PREPARING
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"status":"PREPARING","message":"Entorno listo, configurando proyecto Android"}' \
            "${PUBLIC_BASE_URL}/api/builds/${BUILD_ID}/status?token=${CALLBACK_TOKEN}" || true

      - name: Configurar proyecto Android (nombre, paquete, permisos, fuente, icono)
        env:
          SOURCE_ZIP: source.zip
        run: node scripts/configure-android.mjs

      - name: Reportar estado BUILDING
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"status":"BUILDING","message":"Compilando APK con Gradle assembleDebug"}' \
            "${PUBLIC_BASE_URL}/api/builds/${BUILD_ID}/status?token=${CALLBACK_TOKEN}" || true

      - name: Compilar APK debug (firmado)
        id: gradle
        run: |
          cd android-template
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      # ── En caso de fallo: reportar ERROR con salida truncada ──────────
      - name: Reportar error de compilación
        if: failure()
        run: |
          node -e "
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = 'Sin salida de compilación disponible'; }
            log = log.slice(-2000);
            const body = JSON.stringify({ status: 'ERROR', error: 'Falló la compilación de Gradle', message: log });
            fs.writeFileSync('/tmp/nexa-error.json', body);
          "
          curl -sS -X POST -H "Content-Type: application/json" \
            --data-binary @/tmp/nexa-error.json \
            "${PUBLIC_BASE_URL}/api/builds/${BUILD_ID}/status?token=${CALLBACK_TOKEN}" || true

      # ── Éxito: subir APK al backend, luego reportar COMPLETED ─────────
      - name: Subir APK como artifact (respaldo)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: android-template/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Subir APK al backend de NEXA
        if: success()
        run: |
          APK=android-template/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          curl -sS -X POST -F "apk=@${APK}" \
            "${PUBLIC_BASE_URL}/api/builds/${BUILD_ID}/apk?token=${CALLBACK_TOKEN}"

      - name: Reportar estado COMPLETED
        if: success()
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"status":"COMPLETED","message":"APK compilado y subido correctamente"}' \
            "${PUBLIC_BASE_URL}/api/builds/${BUILD_ID}/status?token=${CALLBACK_TOKEN}" || true
